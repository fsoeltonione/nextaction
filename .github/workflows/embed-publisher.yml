name: Embed Publisher Contract

on:
  pull_request:
    paths:
      - "public/nextaction.js"
      - "src/app/activate/**"
      - "src/app/v1/public-offer/**"
      - "src/app/api/analyze/**"
      - "scripts/embed-publisher-contract-test.mjs"
      - "package.json"
      - "package-lock.json"
  push:
    branches:
      - master
    paths:
      - "public/nextaction.js"
      - "src/app/activate/**"
      - "src/app/v1/public-offer/**"
      - "src/app/api/analyze/**"
      - "scripts/embed-publisher-contract-test.mjs"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm
      - name: Install
        run: npm ci
      - name: Run embed publisher contract
        run: npm run test:embed-publisher
