name: Cloudflare Production Audit (Read-Only)

on:
  workflow_dispatch:
  # Run the diagnostic audit after changes to its own implementation land on master.
  # This workflow is read-only and never deploys production.
  push:
    branches:
      - master
    paths:
      - ".github/workflows/cloudflare-production-audit.yml"
      - "scripts/cloudflare-production-audit.mjs"

permissions:
  contents: read

concurrency:
  group: cloudflare-production-audit-readonly
  cancel-in-progress: false

jobs:
  audit:
    name: Audit active production Worker (read-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ENVIRONMENT: production
      CLOUDFLARE_EXPECTED_HOSTNAME: ${{ vars.CLOUDFLARE_EXPECTED_HOSTNAME || 'nextaction.fsoeltoni-one.workers.dev' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate audit inputs
        run: bash scripts/require-env.sh CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID

      - name: Audit active production Worker
        run: npm run cloudflare:production-audit
