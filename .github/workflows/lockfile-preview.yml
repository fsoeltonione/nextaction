name: Temporary lockfile generation

on:
  pull_request:
    branches:
      - master
    paths:
      - "package.json"
      - ".github/workflows/lockfile-preview.yml"

permissions:
  contents: read

jobs:
  generate:
    name: Regenerate package lock for compatibility review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0

      - name: Generate lockfile without executing lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Emit generated lockfile for review
        shell: bash
        run: |
          printf '\nLOCKFILE_JSON_START\n'
          cat package-lock.json
          printf '\nLOCKFILE_JSON_END\n'
