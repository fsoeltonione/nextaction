version: 2.1

parameters:
  run_release_gate:
    type: boolean
    default: false

jobs:
  quality:
    docker:
      - image: cimg/node:24.21.0
    environment:
      NEXT_PUBLIC_SUPABASE_URL: https://ci.invalid.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
    steps:
      - checkout
      - run:
          name: Verify runtime
          command: |
            node --version
            npm --version
      - restore_cache:
          keys:
            - v1-npm-deps-{{ checksum "package-lock.json" }}
            - v1-npm-deps-
      - run:
          name: Install
          command: npm ci
      - save_cache:
          key: v1-npm-deps-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Lint
          command: npm run lint
      - run:
          name: Typecheck
          command: npm run typecheck
      - run:
          name: Build
          command: npm run build

  release_boundary_contract:
    docker:
      - image: cimg/node:24.21.0
    steps:
      - checkout
      - run:
          name: Install
          command: npm ci
      - run:
          name: Verify release boundary contract
          command: npm run test:release-boundary

  product_scanner_security:
    docker:
      - image: cimg/node:24.21.0
    steps:
      - checkout
      - run:
          name: Install
          command: npm ci
      - run:
          name: Run product scanner security suite
          command: npm run test:scanner

  cloudflare_compatibility:
    docker:
      - image: cimg/node:24.21.0
    steps:
      - checkout
      - run:
          name: Install
          command: npm ci
      - run:
          name: Check Cloudflare compatibility
          command: npm run cloudflare:check

  cloudflare_build:
    docker:
      - image: cimg/node:24.21.0
    environment:
      NEXT_PUBLIC_SUPABASE_URL: https://ci.invalid.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      SUPABASE_SECRET_KEY: ci-placeholder
    steps:
      - checkout
      - run:
          name: Install
          command: npm ci
      - run:
          name: Build Cloudflare artifact
          command: CLOUDFLARE_ENV=staging npm run cloudflare:build
      - run:
          name: Validate Wrangler configuration
          command: npx --yes wrangler@4.139.0 deploy --dry-run --env staging

  analysis_provider_contract:
    docker:
      - image: cimg/node:24.21.0
    steps:
      - checkout
      - run:
          name: Install
          command: npm ci
      - run:
          name: Run analysis provider response contract tests
          command: npm run test:analysis-provider

  analysis_output_contract:
    docker:
      - image: cimg/node:24.21.0
    steps:
      - checkout
      - run:
          name: Install
          command: npm ci
      - run:
          name: Run analysis output contract tests
          command: npm run test:analysis-output

  analysis_provider_content_contract:
    docker:
      - image: cimg/node:24.21.0
    steps:
      - checkout
      - run:
          name: Install
          command: npm ci
      - run:
          name: Run analysis provider content contract tests
          command: npm run test:analysis-provider-content

  stage16_activation_contract:
    docker:
      - image: cimg/node:24.21.0
    steps:
      - checkout
      - run:
          name: Install
          command: npm ci
      - run:
          name: Run Stage 16 activation contract checks
          command: npm run test:stage16-activation

  runtime_hardening_contract:
    docker:
      - image: cimg/node:24.21.0
    steps:
      - checkout
      - run:
          name: Install
          command: npm ci
      - run:
          name: Run H0/H1 runtime hardening contract
          command: npm run test:runtime-hardening

  h2_3_release_proof_contract:
    docker:
      - image: cimg/node:24.21.0
    steps:
      - checkout
      - run:
          name: Install
          command: npm ci
      - run:
          name: Run H2.3 release proof contract
          command: npm run test:h2-3-release-proof


  h3_1_network_moment_contract:
    docker:
      - image: cimg/node:24.21.0
    steps:
      - checkout
      - run:
          name: Install
          command: npm ci
      - run:
          name: Run H3.1 Network Moment contract
          command: npm run test:h3-1-network-moment


  analysis_provider_smoke:
    docker:
      - image: cimg/node:24.21.0
    steps:
      - checkout
      - run:
          name: Install
          command: npm ci
      - run:
          name: Validate configured analysis provider
          command: npm run analysis:provider-smoke

  release_source_guard:
    docker:
      - image: cimg/node:24.21.0
    environment:
      NEXTACTION_RELEASE_BRANCH: << pipeline.git.branch >>
    steps:
      - checkout
      - run:
          name: Enforce release source branch
          command: |
            bash scripts/require-env.sh NEXTACTION_RELEASE_BRANCH
            if [ "${NEXTACTION_RELEASE_BRANCH}" != "master" ]; then
              echo "Release gate may only run from master, got: ${NEXTACTION_RELEASE_BRANCH}" >&2
              exit 1
            fi

  deploy_staging:
    docker:
      - image: cimg/node:24.21.0
    environment:
      NEXTACTION_RELEASE_BRANCH: << pipeline.git.branch >>
    steps:
      - checkout
      - run:
          name: Install
          command: npm ci
      - run:
          name: Validate staging secrets
          command: |
            bash scripts/require-env.sh \
              CLOUDFLARE_API_TOKEN \
              CLOUDFLARE_ACCOUNT_ID \
              STAGING_NEXT_PUBLIC_SUPABASE_URL \
              STAGING_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
              STAGING_SUPABASE_SECRET_KEY \
              ANALYSIS_API_KEY \
              ANALYSIS_BASE_URL \
              ANALYSIS_MODEL
      - run:
          name: Deploy staging
          command: |
            mkdir -p /tmp/nextaction-release
            export WRANGLER_OUTPUT_FILE_PATH="/tmp/nextaction-release/wrangler-staging.ndjson"
            export NEXT_PUBLIC_SUPABASE_URL="${STAGING_NEXT_PUBLIC_SUPABASE_URL}"
            export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="${STAGING_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}"
            export SUPABASE_SECRET_KEY="${STAGING_SUPABASE_SECRET_KEY}"
            npm run deploy:cloudflare -- staging
            grep -Eo 'https://[A-Za-z0-9._-]+[.]workers[.]dev' /tmp/nextaction-release/wrangler-staging.ndjson \
              | tail -1 \
              > /tmp/nextaction-release/staging_base_url
            bash scripts/require-file.sh /tmp/nextaction-release/staging_base_url
      - persist_to_workspace:
          root: /tmp/nextaction-release
          paths:
            - staging_base_url

  staging_smoke:
    docker:
      - image: cimg/node:24.21.0
    environment:
      STAGING_EXPECTED_RELEASE_SHA: << pipeline.git.revision >>
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/nextaction-release
      - run:
          name: Install
          command: npm ci
      - run:
          name: Validate staging smoke inputs
          command: |
            bash scripts/require-file.sh /tmp/nextaction-release/staging_base_url
            bash scripts/require-env.sh STAGING_INTEGRATION_TOKEN
      - run:
          name: Run staging smoke
          command: |
            export STAGING_BASE_URL="$(cat /tmp/nextaction-release/staging_base_url)"
            npm run staging:smoke

  deploy_production:
    docker:
      - image: cimg/node:24.21.0
    environment:
      NEXTACTION_RELEASE_BRANCH: << pipeline.git.branch >>
    steps:
      - checkout
      - run:
          name: Install
          command: npm ci
      - run:
          name: Validate production secrets
          command: |
            bash scripts/require-env.sh \
              CLOUDFLARE_API_TOKEN \
              CLOUDFLARE_ACCOUNT_ID \
              PRODUCTION_NEXT_PUBLIC_SUPABASE_URL \
              PRODUCTION_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
              PRODUCTION_SUPABASE_SECRET_KEY \
              ANALYSIS_API_KEY \
              ANALYSIS_BASE_URL \
              ANALYSIS_MODEL
      - run:
          name: Deploy production
          command: |
            mkdir -p /tmp/nextaction-release
            export WRANGLER_OUTPUT_FILE_PATH="/tmp/nextaction-release/wrangler-production.ndjson"
            export NEXT_PUBLIC_SUPABASE_URL="${PRODUCTION_NEXT_PUBLIC_SUPABASE_URL}"
            export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="${PRODUCTION_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}"
            export SUPABASE_SECRET_KEY="${PRODUCTION_SUPABASE_SECRET_KEY}"
            npm run deploy:cloudflare -- production
            grep -Eo 'https://[A-Za-z0-9._-]+[.]workers[.]dev' /tmp/nextaction-release/wrangler-production.ndjson \
              | tail -1 \
              > /tmp/nextaction-release/production_base_url
            bash scripts/require-file.sh /tmp/nextaction-release/production_base_url
      - persist_to_workspace:
          root: /tmp/nextaction-release
          paths:
            - production_base_url


  cloudflare_production_audit:
    docker:
      - image: cimg/node:24.21.0
    steps:
      - checkout
      - run:
          name: Validate Cloudflare audit inputs
          command: |
            bash scripts/require-env.sh CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
      - run:
          name: Audit active production Worker
          command: |
            CLOUDFLARE_ENVIRONMENT=production npm run cloudflare:production-audit

  production_smoke:
    docker:
      - image: cimg/node:24.21.0
    environment:
      PRODUCTION_EXPECTED_RELEASE_SHA: << pipeline.git.revision >>
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/nextaction-release
      - run:
          name: Install
          command: npm ci
      - run:
          name: Validate production smoke inputs
          command: |
            bash scripts/require-file.sh /tmp/nextaction-release/production_base_url
            bash scripts/require-env.sh \
              PRODUCTION_NEXT_PUBLIC_SUPABASE_URL \
              PRODUCTION_SUPABASE_SECRET_KEY
      - run:
          name: Run production runtime smoke
          command: |
            export PRODUCTION_BASE_URL="$(cat /tmp/nextaction-release/production_base_url)"
            npm run production:smoke

  h3_1_staging_release_proof:
    docker:
      - image: cimg/node:24.21.0
    environment:
      STAGING_EXPECTED_RELEASE_SHA: << pipeline.git.revision >>
    steps:
      - checkout
      - run:
          name: Install
          command: npm ci
      - run:
          name: Validate H3.1 staging proof inputs
          command: |
            bash scripts/require-env.sh \
              STAGING_NEXT_PUBLIC_SUPABASE_URL \
              STAGING_SUPABASE_SECRET_KEY
      - run:
          name: Run H3.1 staging release proof
          command: |
            npm run h3-1:release-proof -- staging


  h3_1_staging_runtime_smoke:
    docker:
      - image: cimg/node:24.21.0
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/nextaction-release
      - run:
          name: Install
          command: npm ci
      - run:
          name: Validate H3.1 runtime smoke inputs
          command: |
            bash scripts/require-env.sh \
              STAGING_NEXT_PUBLIC_SUPABASE_URL \
              STAGING_SUPABASE_SECRET_KEY \
              STAGING_INTEGRATION_TOKEN
      - run:
          name: Run H3.1 staging runtime smoke
          command: |
            export STAGING_BASE_URL="$(cat /tmp/nextaction-release/staging_base_url)"
            npm run test:h3-1-runtime-smoke


  h3_1_production_release_proof:
    docker:
      - image: cimg/node:24.21.0
    steps:
      - checkout
      - run:
          name: Install
          command: npm ci
      - run:
          name: Validate H3.1 production proof inputs
          command: |
            bash scripts/require-env.sh \
              PRODUCTION_NEXT_PUBLIC_SUPABASE_URL \
              PRODUCTION_SUPABASE_SECRET_KEY
      - run:
          name: Run H3.1 production release proof
          command: |
            npm run h3-1:release-proof -- production


  production_release_proof:
    docker:
      - image: cimg/node:24.21.0
    environment:
      PRODUCTION_EXPECTED_RELEASE_SHA: << pipeline.git.revision >>
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/nextaction-release
      - run:
          name: Install
          command: npm ci
      - run:
          name: Validate production release proof inputs
          command: |
            bash scripts/require-file.sh /tmp/nextaction-release/production_base_url
            bash scripts/require-env.sh \
              PRODUCTION_NEXT_PUBLIC_SUPABASE_URL \
              PRODUCTION_SUPABASE_SECRET_KEY
      - run:
          name: Run production release proof
          command: |
            export PRODUCTION_BASE_URL="$(cat /tmp/nextaction-release/production_base_url)"
            npm run production:release-proof

workflows:
  quality-gate:
    jobs:
      - quality
      - release_boundary_contract:
          requires:
            - quality
      - product_scanner_security:
          requires:
            - quality
            - release_boundary_contract
      - analysis_provider_contract:
          requires:
            - quality
      - analysis_output_contract:
          requires:
            - quality
      - analysis_provider_content_contract:
          requires:
            - quality
      - stage16_activation_contract:
          requires:
            - quality
      - runtime_hardening_contract:
          requires:
            - quality
      - h2_3_release_proof_contract:
          requires:
            - quality
      - h3_1_network_moment_contract:
          requires:
            - quality
      - cloudflare_compatibility:
          requires:
            - quality
            - product_scanner_security
            - runtime_hardening_contract
            - analysis_provider_contract
            - analysis_output_contract
            - analysis_provider_content_contract
            - stage16_activation_contract
      - cloudflare_build:
          requires:
            - quality
            - cloudflare_compatibility

  release-gate:
    when: << pipeline.parameters.run_release_gate >>
    jobs:
      - quality
      - release_source_guard:
          filters:
            branches:
              only: master
      - product_scanner_security:
          requires:
            - quality
      - cloudflare_compatibility:
          requires:
            - quality
            - product_scanner_security
            - runtime_hardening_contract
      - cloudflare_build:
          requires:
            - cloudflare_compatibility
      - analysis_provider_contract:
          requires:
            - quality
      - analysis_output_contract:
          requires:
            - quality
      - analysis_provider_content_contract:
          requires:
            - quality
      - stage16_activation_contract:
          requires:
            - quality
      - runtime_hardening_contract:
          requires:
            - quality
      - h2_3_release_proof_contract:
          requires:
            - quality
      - h3_1_network_moment_contract:
          requires:
            - quality
      - analysis_provider_smoke:
          context:
            - nextaction-staging
          filters:
            branches:
              only: master
          requires:
            - quality
            - release_source_guard
            - cloudflare_build
            - analysis_provider_contract
            - analysis_output_contract
            - analysis_provider_content_contract
      - deploy_staging:
          context:
            - nextaction-cloudflare
            - nextaction-staging
          filters:
            branches:
              only: master
          requires:
            - quality
            - release_source_guard
            - cloudflare_compatibility
            - cloudflare_build
            - analysis_provider_smoke
            - stage16_activation_contract
            - runtime_hardening_contract
            - h2_3_release_proof_contract
            - h3_1_network_moment_contract
      - staging_smoke:
          context:
            - nextaction-staging
          filters:
            branches:
              only: master
          requires:
            - deploy_staging
            - release_source_guard

      - h3_1_staging_release_proof:
          context:
            - nextaction-staging
          filters:
            branches:
              only: master
          requires:
            - staging_smoke
            - h3_1_network_moment_contract
            - release_source_guard

      - h3_1_staging_runtime_smoke:
          context:
            - nextaction-staging
          filters:
            branches:
              only: master
          requires:
            - h3_1_staging_release_proof
            - release_source_guard
      - hold_production:
          type: approval
          filters:
            branches:
              only: master
          requires:
            - staging_smoke
            - h3_1_staging_release_proof
            - h3_1_staging_runtime_smoke
            - release_source_guard
      - deploy_production:
          context:
            - nextaction-cloudflare
            - nextaction-production
          filters:
            branches:
              only: master
          requires:
            - hold_production
            - release_source_guard
      - cloudflare_production_audit:
          context:
            - nextaction-cloudflare
          filters:
            branches:
              only: master
          requires:
            - deploy_production
            - release_source_guard
      - production_smoke:
          context:
            - nextaction-production
          filters:
            branches:
              only: master
          requires:
            - deploy_production
            - cloudflare_production_audit
            - release_source_guard

      - h3_1_production_release_proof:
          context:
            - nextaction-production
          filters:
            branches:
              only: master
          requires:
            - production_smoke
            - cloudflare_production_audit
            - release_source_guard

      - production_release_proof:
          context:
            - nextaction-production
          filters:
            branches:
              only: master
          requires:
            - production_smoke
            - h3_1_production_release_proof
            - cloudflare_production_audit
            - release_source_guard
