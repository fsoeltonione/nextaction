version: 2.1

parameters:
  run_release_gate:
    type: boolean
    default: false

jobs:
  quality:
    docker:
      - image: cimg/node:24.21.0
    environment:
      NEXT_PUBLIC_SUPABASE_URL: https://ci.invalid.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
    steps:
      - checkout
      - run:
          name: Verify runtime
          command: |
            node --version
            npm --version
      - restore_cache:
          keys:
            - v1-npm-deps-{{ checksum "package-lock.json" }}
            - v1-npm-deps-
      - run:
          name: Install
          command: npm ci
      - save_cache:
          key: v1-npm-deps-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Lint
          command: npm run lint
      - run:
          name: Typecheck
          command: npm run typecheck
      - run:
          name: Build
          command: npm run build

  cloudflare_compatibility:
    docker:
      - image: cimg/node:24.21.0
    steps:
      - checkout
      - run:
          name: Install
          command: npm ci
      - run:
          name: Check Cloudflare compatibility
          command: npm run cloudflare:check

  cloudflare_build:
    docker:
      - image: cimg/node:24.21.0
    environment:
      NEXT_PUBLIC_SUPABASE_URL: https://ci.invalid.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      SUPABASE_SECRET_KEY: ci-placeholder
    steps:
      - checkout
      - run:
          name: Install
          command: npm ci
      - run:
          name: Build Cloudflare artifact
          command: npm run cloudflare:build
      - run:
          name: Validate Wrangler configuration
          command: npx --yes wrangler@4.139.0 deploy --dry-run --env staging

  deploy_staging:
    docker:
      - image: cimg/node:24.21.0
    steps:
      - checkout
      - run:
          name: Install
          command: npm ci
      - run:
          name: Validate staging secrets
          command: |
            test -n "${CLOUDFLARE_API_TOKEN}"
            test -n "${CLOUDFLARE_ACCOUNT_ID}"
            test -n "${STAGING_NEXT_PUBLIC_SUPABASE_URL}"
            test -n "${STAGING_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}"
            test -n "${STAGING_SUPABASE_SECRET_KEY}"
      - run:
          name: Deploy staging
          command: |
            mkdir -p /tmp/nextaction-release
            export WRANGLER_OUTPUT_FILE_PATH="/tmp/nextaction-release/wrangler-staging.ndjson"
            export NEXT_PUBLIC_SUPABASE_URL="${STAGING_NEXT_PUBLIC_SUPABASE_URL}"
            export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="${STAGING_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}"
            export SUPABASE_SECRET_KEY="${STAGING_SUPABASE_SECRET_KEY}"
            npm run deploy:cloudflare -- staging
            grep -Eo 'https://[A-Za-z0-9._-]+[.]workers[.]dev' /tmp/nextaction-release/wrangler-staging.ndjson \
              | tail -1 \
              > /tmp/nextaction-release/staging_base_url
            test -s /tmp/nextaction-release/staging_base_url
      - persist_to_workspace:
          root: /tmp/nextaction-release
          paths:
            - staging_base_url

  staging_smoke:
    docker:
      - image: cimg/node:24.21.0
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/nextaction-release
      - run:
          name: Install
          command: npm ci
      - run:
          name: Validate staging smoke inputs
          command: |
            test -s /tmp/nextaction-release/staging_base_url
            test -n "${STAGING_INTEGRATION_TOKEN}"
            test -n "${STAGING_MOMENT_KEY}"
      - run:
          name: Run staging smoke
          command: |
            export STAGING_BASE_URL="$(cat /tmp/nextaction-release/staging_base_url)"
            npm run staging:smoke

  deploy_production:
    docker:
      - image: cimg/node:24.21.0
    steps:
      - checkout
      - run:
          name: Install
          command: npm ci
      - run:
          name: Validate production secrets
          command: |
            test -n "${CLOUDFLARE_API_TOKEN}"
            test -n "${CLOUDFLARE_ACCOUNT_ID}"
            test -n "${PRODUCTION_NEXT_PUBLIC_SUPABASE_URL}"
            test -n "${PRODUCTION_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}"
            test -n "${PRODUCTION_SUPABASE_SECRET_KEY}"
      - run:
          name: Deploy production
          command: |
            mkdir -p /tmp/nextaction-release
            export WRANGLER_OUTPUT_FILE_PATH="/tmp/nextaction-release/wrangler-production.ndjson"
            export NEXT_PUBLIC_SUPABASE_URL="${PRODUCTION_NEXT_PUBLIC_SUPABASE_URL}"
            export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="${PRODUCTION_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}"
            export SUPABASE_SECRET_KEY="${PRODUCTION_SUPABASE_SECRET_KEY}"
            npm run deploy:cloudflare -- production
            grep -Eo 'https://[A-Za-z0-9._-]+[.]workers[.]dev' /tmp/nextaction-release/wrangler-production.ndjson \
              | tail -1 \
              > /tmp/nextaction-release/production_base_url
            test -s /tmp/nextaction-release/production_base_url
      - persist_to_workspace:
          root: /tmp/nextaction-release
          paths:
            - production_base_url

  production_smoke:
    docker:
      - image: cimg/node:24.21.0
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/nextaction-release
      - run:
          name: Install
          command: npm ci
      - run:
          name: Production health smoke
          command: |
            test -s /tmp/nextaction-release/production_base_url
            export STAGING_BASE_URL="$(cat /tmp/nextaction-release/production_base_url)"
            EXPECTED_ENVIRONMENT="production" npm run staging:smoke

workflows:
  quality-gate:
    jobs:
      - quality

  release-gate:
    when: << pipeline.parameters.run_release_gate >>
    jobs:
      - quality
      - cloudflare_compatibility:
          requires:
            - quality
      - cloudflare_build:
          requires:
            - cloudflare_compatibility
      - deploy_staging:
          context:
            - nextaction-cloudflare
            - nextaction-staging
          requires:
            - quality
            - cloudflare_compatibility
            - cloudflare_build
      - staging_smoke:
          context:
            - nextaction-staging
          requires:
            - deploy_staging
      - hold_production:
          type: approval
          requires:
            - staging_smoke
      - deploy_production:
          context:
            - nextaction-cloudflare
            - nextaction-production
          requires:
            - hold_production
      - production_smoke:
          context:
            - nextaction-production
          requires:
            - deploy_production
